<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GPeleX in Browser</title>
        <style>
            :root {
                --primary-color: #008b8b;
                --secondary-color: slategray;
                --background-color: #e6f7e6;
                --button-color: #ccedab;
                --button-hover-color: #afe67f;
                --error-color: #8b0000;
            }
            body {
                font-family: Arial, sans-serif;
                background-color: var(--background-color);
                padding: 20px;
                display: flex;
                justify-content: center;
                line-height: 1.5;
            }
            .container {
                max-width: 800px;
                width: 100%;
            }
            h1 {
                font-family: Arial, sans-serif;
                color: var(--primary-color);
            }
            .subheader {
                font-weight: normal;
                color: var(--secondary-color);
                margin-left: 0.5em;
            }
            .border {
                border: 2px solid var(--primary-color);
                border-radius: 8px;
                padding: 8px;
                gap: 5px;
                display: flex;
                flex-direction: column;
                margin-bottom: 5px;
            }
            .border label {
                width: 100%;
                display: block;
                cursor: pointer;
            }
            .border button {
                margin-top: 0px;
                margin-left: auto;
            }
            button,
            input[type="file"]::file-selector-button {
                padding: 8px 16px;
                background-color: var(--button-color);
                border: 1px solid var(--primary-color);
                border-radius: 4px;
                cursor: pointer;
            }
            button:hover,
            input[type="file"]::file-selector-button:hover {
                background-color: var(--button-hover-color);
            }
            button:disabled {
                background-color: var(--background-color);
                cursor: not-allowed;
            }
            .error {
                color: var(--error-color);
            }
            .spinner-container {
                display: inline-flex;
                align-items: center;
            }
            .spinner {
                width: 16px;
                height: 16px;
                border: 2px solid var(--primary-color);
                border-top-color: transparent;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                margin-right: 8px;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .spinner-hidden {
                display: none;
            }
            .footnote {
                color: var(--secondary-color);
                font-size: 0.8em;
                margin: 0;
            }
            input[type="checkbox"] {
                cursor: pointer;
                width: 1.2em;
                height: 1.2em;
            }
        </style>
        <script
            type="text/javascript"
            src="https://cdn.jsdelivr.net/pyodide/v0.29.4/full/pyodide.js"
        ></script>
    </head>
    <body>
        <div class="container">
            <h1>
                GPeleX <span class="subheader"> Add elevation data to GPX files </span>
            </h1>
            <div class="border">
                <label>
                    Select GPX Files:<br />
                    <input type="file" id="gpxFiles" accept=".gpx" multiple />
                </label>
                <label>
                    Select Elevation Maps<sup>*</sup>:<br />
                    <input
                        type="file"
                        id="demFiles"
                        accept=".tif,.tar,tar.gz,.zip"
                        multiple
                    />
                </label>
                <label>
                    <input type="checkbox" id="forceOverwrite" />
                    Force overwrite existing elevation data
                </label>
                <button id="runButton" disabled class="spinner-container">
                    <span id="spinner" class="spinner"></span>
                    Add elevation<sup>**</sup>
                </button>
            </div>
            <p class="footnote">
                <sup>*</sup>Elevation files can be downloaded from, e.g.,
                <a href="https://viewfinderpanoramas.org/dem3.html" target="_blank">
                    Viewfinder Panoramas
                </a>
                or national databases.
            </p>
            <p class="footnote">
                <sup>**</sup>All processing happens locally on your device. No data is
                uploaded or shared.
            </p>
            <br />
            <div id="output"></div>
            <br />
            <div id="downloadSection" class="border" style="display: none">
                Download processed files:
            </div>
        </div>
        <script type="text/javascript">
            function showError(message) {
                const err = document.createElement("div");
                err.className = "error";
                err.innerHTML = message.replace(/\n/g, "<br>");
                document.getElementById("output").appendChild(err);
            }
            function showMessage(message) {
                const err = document.createElement("div");
                err.innerHTML = message;
                document.getElementById("output").appendChild(err);
            }

            async function main() {
                const runButton = document.getElementById("runButton");
                const gpxFilesInput = document.getElementById("gpxFiles");
                const demFilesInput = document.getElementById("demFiles");
                const downloadSection = document.getElementById("downloadSection");

                runButton.disabled = true;
                document.getElementById("spinner").classList.remove("spinner-hidden");

                let pyodide;
                try {
                    pyodide = await loadPyodide();
                    await pyodide.loadPackage(["numpy", "scipy", "rasterio"]);
                    const response = await fetch("gpelex.py");
                    const scriptContent = await response.text();
                    pyodide.FS.writeFile("gpelex.py", scriptContent);
                    await pyodide.runPythonAsync("import gpelex");
                } catch (error) {
                    showError(error);
                    document.getElementById("spinner").classList.add("spinner-hidden");
                    return;
                }

                runButton.addEventListener("click", async () => {
                    if (gpxFilesInput.files.length === 0) {
                        showMessage("Please select at least one GPX file.");
                        return;
                    }
                    if (demFilesInput.files.length === 0) {
                        showMessage("Please select at least one elevation file.");
                        return;
                    }
                    runButton.disabled = true;
                    document.getElementById("spinner").classList.remove("spinner-hidden");

                    var demFileNames = "[";
                    for (const demFile of demFilesInput.files) {
                        const demContent = await demFile.arrayBuffer();
                        pyodide.FS.writeFile(demFile.name, new Uint8Array(demContent));
                        demFileNames += "'" + demFile.name + "',";
                    }
                    demFileNames += "]";

                    for (const gpxFile of gpxFilesInput.files) {
                        const gpxContent = await gpxFile.text();
                        pyodide.FS.writeFile(gpxFile.name, gpxContent);

                        try {
                            const forceOverwrite =
                                document.getElementById("forceOverwrite").checked;
                            const outputFileName = await pyodide.runPythonAsync(
                                `gpelex.add_elevation_to_gpx("${gpxFile.name}", ${demFileNames}, None, ${forceOverwrite ? "True" : "False"}, True)`,
                            );

                            // Create a download link for the processed GPX file
                            const newGpxContent = pyodide.FS.readFile(outputFileName, {
                                encoding: "utf8",
                            });
                            const newGpxBlob = new Blob([newGpxContent], {
                                type: "application/gpx+xml",
                            });
                            const processedGpxUrl = URL.createObjectURL(newGpxBlob);
                            const downloadLink = document.createElement("a");
                            downloadLink.href = processedGpxUrl;
                            downloadLink.download = outputFileName;
                            downloadLink.textContent = outputFileName;
                            downloadSection.appendChild(document.createElement("br"));
                            downloadSection.appendChild(downloadLink);
                            if (gpxFile.name == outputFileName) {
                                downloadSection.append(" (No change)");
                            }
                            downloadSection.style.display = "block";
                        } catch (error) {
                            showError(
                                `Error processing ${gpxFile.name}: ${error.message}`,
                            );
                            throw error;
                        }
                    }
                    document.getElementById("spinner").classList.add("spinner-hidden");
                    runButton.disabled = false;
                });

                document.getElementById("spinner").classList.add("spinner-hidden");
                runButton.disabled = false;
            }
            main();
        </script>
    </body>
</html>
